# Kamal deploy config for Collective Player Games (collectiveplayer.games).
#
# The VPS hostname/IP is read from the COLLECTIVEPLAYER_GAMES_VPS env var
# so it never lands in the repo. Set it in your shell before running Kamal:
#   export COLLECTIVEPLAYER_GAMES_VPS=1.2.3.4
# (Add to ~/.zshenv, direnv, or a password manager on your workstation.)

service: collectiveplayer-games

# Image built and pushed to GitHub Container Registry
image: ibis-coordination/collectiveplayer.games

servers:
  web:
    - <%= ENV.fetch("COLLECTIVEPLAYER_GAMES_VPS") %>

# Kamal Proxy terminates SSL and multiplexes multiple apps on the same
# host. Certs come from Let's Encrypt automatically once DNS for
# collectiveplayer.games points at this server.
proxy:
  ssl: true
  host: collectiveplayer.games
  # The app container listens on 80 (via Thruster in front of Puma).
  # app_port: 80

registry:
  server: ghcr.io
  username: ibis-coordination
  password:
    - KAMAL_REGISTRY_PASSWORD    # a GitHub PAT with write:packages

# ARM builds fail with libpq on Apple Silicon → build linux/amd64 to
# match the VPS. If your VPS is ARM, change this to arm64.
builder:
  arch: amd64

env:
  clear:
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
  # POSTGRES_PASSWORD is read by config/database.yml; env.clear values
  # don't expand ${VARS}, so the DB URL is assembled in database.yml
  # from the accessory host + the injected password rather than passed
  # as one pre-composed URL.
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD

# Convenience shortcuts:
#   bin/kamal ship --version=v0.1.0  → deploy a CI-built image tag
#                                       (skips local build+push; the image
#                                       must already exist in ghcr.io,
#                                       built by .github/workflows/docker-publish.yml)
#   bin/kamal shell                   → bash in the app container
#   bin/kamal console                 → rails console
#   bin/kamal dbc                     → psql shell against the app DB
aliases:
  ship: deploy --skip-push
  shell: app exec --interactive --reuse "bash"
  console: app exec --interactive --reuse "bin/rails console"
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Postgres runs as a Kamal accessory alongside the app on the same VPS.
# Data persists in the `db-data` named volume; backups are your job.
accessories:
  db:
    image: postgres:17-alpine
    host: <%= ENV.fetch("COLLECTIVEPLAYER_GAMES_VPS") %>    # same VPS as the app
    port: "127.0.0.1:5432:5432"    # only reachable from localhost on the host
    env:
      clear:
        POSTGRES_USER: collectiveplayer_games
        POSTGRES_DB: collectiveplayer_games
      secret:
        - POSTGRES_PASSWORD
    directories:
      - db-data:/var/lib/postgresql/data
